apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline

  params:
    - name: IMAGE
      value: us.icr.io/YOUR_NAMESPACE/tax-calculator:pipeline

  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: tax-calculator-pvc
