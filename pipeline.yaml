apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  workspaces:
    - name: source

  params:
    - name: image
      type: string

  tasks:
    - name: npminstall
      taskRef:
        name: npminstall
      workspaces:
        - name: source
          workspace: source

    - name: tests
      runAfter:
        - npminstall
      taskRef:
        name: tests
      workspaces:
        - name: source
          workspace: source

    - name: build
      runAfter:
        - tests
      taskRef:
        name: build-image
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
