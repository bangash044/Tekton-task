apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: npminstall
spec:
workspaces:
- name: source
steps:
- name: npm-install
image: node:20
workingDir: $(workspaces.source.path)
script: |
#!/bin/sh
set -e
npm install

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: tests
spec:
workspaces:
- name: source
steps:
- name: jasmine-tests
image: node:20
workingDir: $(workspaces.source.path)
script: |
#!/bin/sh
set -e
npx jasmine

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: build
spec:
params:
- name: IMAGE
type: string
workspaces:
- name: source
steps:
- name: build-image
image: gcr.io/kaniko-project/executor:latest
args:
- --dockerfile=$(workspaces.source.path)/Dockerfile
- --context=$(workspaces.source.path)
- --destination=$(params.IMAGE)
