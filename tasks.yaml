apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: npminstall
spec:
description: Install the Node.js dependencies for the Tax Calculator application.
workspaces:
- name: source
steps:
- name: npm-install
image: node:20
workingDir: $(workspaces.source.path)
script: |
#!/bin/sh
set -e
echo "Installing npm dependencies..."
npm install
echo "npm install completed successfully."

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: tests
spec:
description: Run the Jasmine unit tests for the Tax Calculator application.
workspaces:
- name: source
steps:
- name: jasmine-tests
image: node:20
workingDir: $(workspaces.source.path)
script: |
#!/bin/sh
set -e
echo "Running Jasmine unit tests..."
npx jasmine
echo "Jasmine tests completed successfully."

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
name: build
spec:
description: Build and push the Tax Calculator Docker image.
params:
- name: IMAGE
description: Full destination image name.
type: string
workspaces:
- name: source
steps:
- name: build-and-push
image: gcr.io/kaniko-project/executor:latest
args:
- --dockerfile=$(workspaces.source.path)/Dockerfile
- --context=$(workspaces.source.path)
- --destination=$(params.IMAGE)
